<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ruleta de Participantes</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ea580c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ruleta">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Estilos globales y comportamiento táctil móvil */
    body {
      background-color: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Glows y sombras neón en naranja */
    .border-orange-glow {
      border-color: #ea580c;
      box-shadow: 0 0 15px rgba(234, 88, 12, 0.3);
    }

    .btn-orange-glow {
      background: linear-[#ea580c];
      background-image: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      box-shadow: 0 4px 20px rgba(234, 88, 12, 0.4);
    }

    .btn-orange-glow:active {
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(234, 88, 12, 0.6);
    }

    /* Ocultar barra de desplazamiento manteniendo scroll funcional */
    textarea::-webkit-scrollbar {
      width: 6px;
    }
    textarea::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 select-none overflow-x-hidden">

  <!-- Encabezado PWA -->
  <header class="w-full max-w-lg text-center pt-2 pb-4">
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-orange-500 to-amber-500">
      Ruleta de Sortear
    </h1>
  </header>

  <!-- Contenedor Principal de la Ruleta y Formulario -->
  <main class="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-2 gap-8 items-center my-auto">
    
    <!-- Sección Visual de la Ruleta -->
    <div class="flex flex-col items-center justify-center relative order-1 lg:order-2">
      <!-- Indicador superior naranja neón con sombra -->
      <div class="w-0 h-0 border-l-[18px] border-l-transparent border-r-[18px] border-r-transparent border-t-[30px] border-t-orange-500 absolute -top-4 z-20 filter drop-shadow-[0_4px_8px_rgba(234,88,12,0.8)]"></div>
      
      <!-- Canvas de la Ruleta -->
      <div class="relative p-2 rounded-full border-2 border-orange-500/40 bg-slate-900/80 shadow-[0_0_30px_rgba(234,88,12,0.15)]">
        <canvas id="wheel" width="360" height="360" class="max-w-full h-auto touch-none"></canvas>
      </div>
    </div>

    <!-- Sección Controles e Ingreso de Datos -->
    <div class="flex flex-col gap-4 bg-slate-900/90 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl order-2 lg:order-1">
      <div>
        <label for="namesInput" class="block text-sm font-semibold text-orange-400 mb-2">
          Editar participantes (uno por línea):
        </label>
        <textarea id="namesInput" rows="5" class="w-full p-3 bg-slate-950/80 border border-slate-700/80 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 resize-none text-base transition-all" placeholder="Escribe aquí los nombres..."></textarea>
      </div>

      <!-- Control de eliminación de participante sorteado -->
      <label class="flex items-center gap-3 p-2 rounded-lg bg-slate-950/50 border border-slate-800/80 cursor-pointer text-sm text-slate-300">
        <input type="checkbox" id="removeWinnerCheck" checked class="w-5 h-5 accent-orange-500 rounded cursor-pointer">
        <span>Eliminar <strong>participante sorteado</strong> automáticamente</span>
      </label>

      <!-- Botón de Giro Táctil -->
      <button id="spinBtn" class="w-full py-4 text-lg font-bold text-white rounded-xl btn-orange-glow transition-all duration-150 flex items-center justify-center gap-2">
        <span>¡Girar Ruleta!</span>
      </button>

      <!-- Indicador de estado en pantalla -->
      <div id="result" class="text-center text-base sm:text-lg font-semibold text-orange-400 min-h-[1.75rem] py-1"></div>
    </div>

  </main>

  <!-- Modal / Banner del Participante Sorteado -->
  <div id="winnerModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-slate-900 border-2 border-orange-500 rounded-2xl p-6 sm:p-8 max-w-sm w-full text-center shadow-[0_0_40px_rgba(234,88,12,0.4)] transform scale-95 transition-transform duration-300" id="modalCard">
      <div class="text-4xl mb-2">🎉</div>
      <h2 class="text-lg uppercase tracking-wider text-orange-400 font-bold mb-1">Participante sorteado</h2>
      <p id="winnerName" class="text-2xl sm:text-3xl font-extrabold text-white my-4 break-words"></p>
      <button id="closeModalBtn" class="w-full py-3 bg-orange-600 hover:bg-orange-500 active:bg-orange-700 text-white font-bold rounded-xl shadow-lg transition-all">
        Continuar
      </button>
    </div>
  </div>

  <footer class="w-full text-center text-xs text-slate-600 py-3">
    Ruleta PWA &bull; Modo Oscuro
  </footer>

  <script>
    // Configuración del canvas y elementos DOM
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const namesInput = document.getElementById('namesInput');
    const spinBtn = document.getElementById('spinBtn');
    const resultDiv = document.getElementById('result');
    const removeWinnerCheck = document.getElementById('removeWinnerCheck');

    const winnerModal = document.getElementById('winnerModal');
    const modalCard = document.getElementById('modalCard');
    const winnerNameElem = document.getElementById('winnerName');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // Nombres por defecto iniciales
    namesInput.value = "Lando\nGeorge\nCharles\nMax\nPierre\nAntonio R";

    // Colores elegantes en contraste con bordes e indicador naranja
    const sliceColors = [
      '#1e293b', // Slate oscuro
      '#1e1b4b', // Índigo profundo
      '#0f172a', // Azul noche
      '#2a1205', // Terracota oscuro
      '#111827', // Gris carbón
      '#31101e'  // Vino oscuro
    ];

    let currentAngle = 0;
    let isSpinning = false;
    let audioCtx = null;
    let lastSliceIndex = -1;

    // Inicializador del motor de audio sintético (click al pasar casilla)
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playClickSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch (e) {}
    }

    function playFanfareSound() {
      if (!audioCtx) return;
      try {
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const startTime = audioCtx.currentTime + idx * 0.1;
          gain.gain.setValueAtTime(0.2, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.3);
        });
      } catch (e) {}
    }

    function getParticipants() {
      return namesInput.value.split('\n').map(n => n.trim()).filter(n => n.length > 0);
    }

    function drawWheel() {
      const names = getParticipants();
      const numOptions = names.length;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 12;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numOptions === 0) {
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
        ctx.strokeStyle = '#ea580c';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#64748b';
        ctx.font = '15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Sin participantes', centerX, centerY);
        return;
      }

      const sliceAngle = (2 * Math.PI) / numOptions;

      names.forEach((name, i) => {
        const startAngle = currentAngle + i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        // Dibujar Sector
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = sliceColors[i % sliceColors.length];
        ctx.fill();

        // Separadores en color NARANJA VIBRANTE
        ctx.strokeStyle = '#ea580c';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Dibujar Texto
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 15px system-ui, sans-serif';
        
        // Truncar textos largos si hay muchas casillas
        let displayName = name;
        if (numOptions > 12 && displayName.length > 10) {
          displayName = displayName.substring(0, 8) + '..';
        }
        
        ctx.fillText(displayName, radius - 22, 5);
        ctx.restore();
      });

      // Círculo Central Naranja Estilizado
      ctx.beginPath();
      ctx.arc(centerX, centerY, 24, 0, 2 * Math.PI);
      ctx.fillStyle = '#090d16';
      ctx.fill();
      ctx.strokeStyle = '#ea580c';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(centerX, centerY, 8, 0, 2 * Math.PI);
      ctx.fillStyle = '#ea580c';
      ctx.fill();
    }

    function checkSoundEffect() {
      const names = getParticipants();
      if (names.length === 0) return;

      const numOptions = names.length;
      const sliceAngle = (2 * Math.PI) / numOptions;
      const normalizedAngle = (currentAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      const topPointer = (3 * Math.PI / 2);
      const currentSlice = Math.floor((topPointer - normalizedAngle + 2 * Math.PI) % (2 * Math.PI) / sliceAngle);

      if (currentSlice !== lastSliceIndex) {
        playClickSound();
        lastSliceIndex = currentSlice;
      }
    }

    function spin() {
      if (isSpinning) return;
      initAudio();

      const names = getParticipants();
      if (names.length < 2) {
        resultDiv.textContent = 'Ingresa al menos 2 participantes para sortear.';
        return;
      }

      isSpinning = true;
      spinBtn.disabled = true;
      spinBtn.classList.add('opacity-50', 'pointer-events-none');
      resultDiv.textContent = 'Sorteando...';

      const spinAngle = Math.random() * 12 + 25;
      let spinTime = 0;
      const spinTimeTotal = Math.random() * 2000 + 4000;

      function rotate() {
        spinTime += 30;
        if (spinTime >= spinTimeTotal) {
          stopSpin();
          return;
        }

        const progress = spinTime / spinTimeTotal;
        const easeOut = Math.pow(1 - progress, 3);
        const deltaAngle = (spinAngle * easeOut * Math.PI) / 180;

        currentAngle += deltaAngle;
        checkSoundEffect();
        drawWheel();
        requestAnimationFrame(rotate);
      }

      rotate();
    }

    function stopSpin() {
      isSpinning = false;
      const names = getParticipants();
      const numOptions = names.length;
      const sliceAngle = (2 * Math.PI) / numOptions;

      const normalizedAngle = (currentAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      const topPointer = (3 * Math.PI / 2);
      const winningIndex = Math.floor((topPointer - normalizedAngle + 2 * Math.PI) % (2 * Math.PI) / sliceAngle);

      const selectedParticipant = names[winningIndex];

      playFanfareSound();
      resultDiv.textContent = `Participante sorteado: ${selectedParticipant}`;

      // Mostrar modal
      winnerNameElem.textContent = selectedParticipant;
      winnerModal.classList.remove('opacity-0', 'pointer-events-none');
      modalCard.classList.remove('scale-95');
      modalCard.classList.add('scale-100');

      // Procesar eliminación si la casilla está activa
      if (removeWinnerCheck.checked) {
        const remainingNames = names.filter((_, index) => index !== winningIndex);
        namesInput.value = remainingNames.join('\n');
      }
    }

    function closeModal() {
      winnerModal.classList.add('opacity-0', 'pointer-events-none');
      modalCard.classList.remove('scale-100');
      modalCard.classList.add('scale-95');

      spinBtn.disabled = false;
      spinBtn.classList.remove('opacity-50', 'pointer-events-none');
      drawWheel();
    }

    namesInput.addEventListener('input', drawWheel);
    spinBtn.addEventListener('click', spin);
    closeModalBtn.addEventListener('click', closeModal);

    // Redimensionado dinámico para móviles
    function handleResize() {
      const containerWidth = canvas.parentElement.clientWidth;
      const targetSize = Math.min(containerWidth - 20, 360);
      if (targetSize > 100) {
        canvas.width = targetSize;
        canvas.height = targetSize;
        drawWheel();
      }
    }

    window.addEventListener('resize', handleResize);

    // Dibujo inicial
    handleResize();

    // Registro del Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registrado correctamente.', reg.scope))
          .catch((err) => console.log('Error registrando Service Worker:', err));
      });
    }
  </script>
</body>
</html>
